<!doctype html>
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mis Cuentas" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Mis Cuentas</title>
    <script>
      // Si una extensión o el traductor del navegador toca la página, React no debe romperse
      ;(function () {
        if (typeof Node !== 'function' || !Node.prototype) return
        var quitar = Node.prototype.removeChild
        Node.prototype.removeChild = function (hijo) {
          if (hijo.parentNode !== this) { if (hijo.parentNode) return hijo.parentNode.removeChild(hijo); return hijo }
          return quitar.apply(this, arguments)
        }
        var insertar = Node.prototype.insertBefore
        Node.prototype.insertBefore = function (nuevo, ref) {
          if (ref && ref.parentNode !== this) return insertar.call(this, nuevo, null)
          return insertar.apply(this, arguments)
        }
      })()
      // Si algo falla y la pantalla se queda vacía, se muestra el error en vez de una página en blanco
      ;(function () {
        function mostrar(msg) {
          setTimeout(function () {
            var root = document.getElementById('root')
            if (root && root.children.length) return
            var d = document.getElementById('error-app') || document.createElement('div')
            d.id = 'error-app'
            d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0f14;color:#e5e7eb;font:15px system-ui;z-index:9999;text-align:center'
            d.innerHTML = '<div style="max-width:520px"><p style="font-weight:700;font-size:18px">Algo ha fallado</p><p style="opacity:.8;word-break:break-word;margin:12px 0">' +
              String(msg).replace(/</g, '&lt;') + '</p><p style="opacity:.6;font-size:13px">Haz una captura de este mensaje. Tus datos están a salvo en la hoja.</p>' +
              '<button onclick="location.hash=\'\';location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:12px;border:0;background:#14b8a6;color:#04201d;font-weight:700">Recargar</button></div>'
            document.body.appendChild(d)
          }, 50)
        }
        window.addEventListener('error', function (e) { mostrar(e.message || e.error) })
        window.addEventListener('unhandledrejection', function (e) { mostrar(e.reason && e.reason.message ? e.reason.message : e.reason) })
      })()
      // aplica el tema antes de pintar para evitar parpadeo
      try {
        var t = localStorage.getItem('miscuentas:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
